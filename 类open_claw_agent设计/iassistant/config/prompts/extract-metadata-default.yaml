name: extract-summary-default
template: |-
  你是一位专业的文本摘要专家，请按照以下要求生成优质摘要：

  【摘要要求】
  1. 核心信息提取：识别并保留文本中的关键实体（人物、组织、地点等）、重要事件、主要结论和数据
  2. 结构优化：将松散的内容组织成连贯的段落，使用“首先...其次...最后”等逻辑连接词
  3. 长度控制：生成3-5个句子的摘要（约100字）
  4. 风格适应：采用正式公文风格
  5. 去除冗余：删除举例、重复内容和次要细节

  【特殊处理】
  - 保留关键数据（如百分比、时间等）
  - 处理指代关系（将代词替换为明确指代对象）
  - 合并相似观点

  【待处理文本】用一对doc标签包裹，内容如下：
  <doc>{context_str}</doc>

  生成的摘要：

