# .pre-commit-config.yaml
repos:
  - repo: local
    hooks:
      - id: isort
        name: isort (fix imports)
        entry: uv run isort
        language: system
        types: [python]
        always_run: true
        pass_filenames: false
        require_serial: true

      - id: black
        name: black (format files)
        entry: uv run black .
        language: system
        types: [python]
        always_run: true
        pass_filenames: false
        require_serial: true
