[project]
name = "iassistant"
version = "0.9.4"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "docx2txt>=0.9",
    "dramatiq-abort>=1.2.1",
    "dramatiq[redis,watch]>=2.0.0",
    "fastapi[standard]>=0.123.0",
    "llama-index-core>=0.14.6",
    "llama-index-embeddings-openai-like>=0.2.2",
    "llama-index-llms-openai-like>=0.5.3",
    "llama-index-readers-file>=0.5.4",
    "llama-index-vector-stores-milvus>=1.0.0",
    "llama-index-vector-stores-opensearch>=1.1.1",
    "nacos-sdk-python>=2.0.9",
    "openinference-instrumentation-llama-index",
    "opentelemetry-exporter-otlp",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-httpx",
    "opentelemetry-sdk",
    "pymongo>=4.15.3",
    "pymupdf>=1.27.2",
]

[tool.isort]
profile = "black"
line_length = 120
force_sort_within_sections = false
order_by_type = true
# skip_glob = ["**/__init__.py"]

[tool.black]
line-length = 120
force-exclude = ''''''

[tool.pyright]
exclude = [
    "**/__pycache__",
]
typeCheckingMode = "off"
executionEnvironments = [
    { extraPaths = [".venv/lib/python3.12/site-packages"] }
]

[[tool.uv.index]]
url = "https://mirrors.tuna.tsinghua.edu.cn/pypi/web/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
