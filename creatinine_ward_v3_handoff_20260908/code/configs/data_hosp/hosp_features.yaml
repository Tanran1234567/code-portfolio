# Feature definitions for the hospital (inpatient) Clin-JEPA pipeline.
#
# ─── Why this differs from configs/data/features.yaml ────────────────────
#
# The ICU pipeline reads mimic-code concept tables that are themselves keyed
# on ICU stay_id, so ~90% of its observation volume comes from chartevents.
# chartevents covers only 19.4% of hospital admissions, so a hospital-scope
# state has to be rebuilt from admission-wide sources.
#
# The lab concepts below are the *same* mimic-code definitions (identical
# itemid whitelists and physiological bounds) applied at hospital scope:
# mimic-code builds chemistry/CBC/bg/... from mimiciv_hosp.labevents, which
# is admission-wide, and only restricts to ICU downstream. Reusing the
# itemid lists therefore keeps concept comparability with the paper while
# raising coverage from 19.4% to ~92.8% of admissions.
#
# ─── Bin width ──────────────────────────────────────────────────────────
#
# step_size_hours = 6, not 1. Measured bin occupancy (fraction of bins with
# >= 1 observation) on 20k sampled admissions, labs + micro + transfers:
#
#     step   all      ICU-overlap   ward-only
#      1h     8.7%      11.7%          7.0%
#      4h    29.3%      37.4%         24.9%
#      6h    39.9%      49.6%         34.7%
#     12h    60.9%      71.6%         55.2%
#
# The ICU pipeline reports a 0.06% empty-observation-hour rate; at 1h the
# hospital cohort would be ~91% empty, so the encoder would spend almost all
# of its compute on "No observations recorded." 6h keeps a median of 16 bins
# per admission (enough for dynamics) while covering the LOS P95 (426h)
# within max_steps. See reports/hosp_pipeline/hosp_density_probe.md.

temporal:
  step_size_hours: 6
  max_steps: 56              # 56 x 6h = 336h = 14 days, same cap as ICU
  min_obs_per_stay: 4

  # Coarser bins hold more events (18.6 per non-empty 6h bin vs the ICU
  # pipeline's 11.7 per hour), and ICU-overlap admissions hold far more.
  # Collapsing to the last reading per (variable, bin) bounds state_text
  # length by the number of variables instead of the event count, which is
  # what keeps windows inside the encoder's 4096-token budget.
  within_bin_agg: last

# ── Observations (state) ────────────────────────────────────────────────
observations:

  # Lab concepts: mimic-code itemid whitelists, joined on hadm_id so they
  # cover ward time as well as ICU time.
  lab_concepts:

    chemistry:
      category: labs
      items:
        50862: {name: albumin, unit: "g/dL", max: 10}
        50930: {name: globulin, unit: "g/dL", max: 10}
        50976: {name: total_protein, unit: "g/dL", max: 20}
        50868: {name: aniongap, unit: "mEq/L", max: 10000, allow_zero: true}
        50882: {name: bicarbonate, unit: "mEq/L", max: 10000}
        51006: {name: bun, unit: "mg/dL", max: 300}
        50893: {name: calcium, unit: "mg/dL", max: 10000}
        50902: {name: chloride, unit: "mEq/L", max: 10000}
        50912: {name: creatinine, unit: "mg/dL", max: 150}
        50931: {name: glucose, unit: "mg/dL", max: 10000}
        50983: {name: sodium, unit: "mEq/L", max: 200}
        50971: {name: potassium, unit: "mEq/L", max: 30}

    complete_blood_count:
      category: labs
      items:
        51221: {name: hematocrit, unit: "%"}
        51222: {name: hemoglobin, unit: "g/dL"}
        51248: {name: mch, unit: "pg"}
        51249: {name: mchc, unit: "%"}
        51250: {name: mcv, unit: "fL"}
        51265: {name: platelet, unit: "K/uL"}
        51279: {name: rbc, unit: "m/uL"}
        51277: {name: rdw, unit: "%"}
        51301: {name: wbc, unit: "K/uL"}

    coagulation:
      category: labs
      items:
        51196: {name: d_dimer, unit: "ng/mL"}
        51214: {name: fibrinogen, unit: "mg/dL"}
        51237: {name: inr, unit: ""}
        51274: {name: pt, unit: "sec"}
        51275: {name: ptt, unit: "sec"}

    enzyme:
      category: labs
      items:
        50861: {name: alt, unit: "IU/L"}
        50863: {name: alp, unit: "IU/L"}
        50878: {name: ast, unit: "IU/L"}
        50867: {name: amylase, unit: "IU/L"}
        50885: {name: bilirubin_total, unit: "mg/dL"}
        50883: {name: bilirubin_direct, unit: "mg/dL"}
        50910: {name: ck_cpk, unit: "IU/L"}
        50927: {name: ggt, unit: "IU/L"}
        50954: {name: ld_ldh, unit: "IU/L"}

    blood_differential:
      category: labs
      items:
        51146: {name: basophils, unit: "%"}
        51200: {name: eosinophils, unit: "%"}
        51244: {name: lymphocytes, unit: "%"}
        51254: {name: monocytes, unit: "%"}
        51256: {name: neutrophils, unit: "%"}
        51144: {name: bands, unit: "%"}

    cardiac_marker:
      category: labs
      items:
        51003: {name: troponin_t, unit: "ng/mL"}
        50911: {name: ck_mb, unit: "ng/mL"}
        50963: {name: ntprobnp, unit: "pg/mL"}

    inflammation:
      category: labs
      items:
        50889: {name: crp, unit: "mg/L"}

    bg:
      category: blood_gas
      items:
        50802: {name: baseexcess, unit: "mEq/L", allow_zero: true}
        50804: {name: totalco2, unit: "mEq/L"}
        50813: {name: lactate, unit: "mmol/L", max: 10000}
        50816: {name: fio2, unit: "%", min: 20, max: 100}
        50817: {name: so2, unit: "%", max: 100}
        50818: {name: pco2, unit: "mmHg"}
        50820: {name: ph, unit: ""}
        50821: {name: po2, unit: "mmHg"}
        50825: {name: temperature, unit: "C"}

  # Ward-side vitals. omr is the only admission-wide vitals source in
  # MIMIC-IV, but it carries chartdate only (no time) and no hadm_id, so
  # readings are pinned to noon of their date and matched into the admission
  # window by subject_id. Daily granularity, which the 6h bin tolerates.
  omr:
    enabled: true
    category: vitals
    pin_hour: 12
    result_names:
      "Blood Pressure":       {name: blood_pressure, unit: "mmHg", split_bp: true}
      "Weight (Lbs)":         {name: weight, unit: "kg", scale: 0.45359237}
      "BMI (kg/m2)":          {name: bmi, unit: "kg/m2"}
      "Height (Inches)":      {name: height, unit: "cm", scale: 2.54}

  # Microbiology: a categorical observation (specimen / organism), the
  # hospital-scope analogue of a culture result appearing on the chart.
  microbiology:
    enabled: true
    category: microbiology
    max_per_bin: 4

  # Care setting from transfers. Ward-vs-ICU-vs-ED location is a genuine
  # hospital-level state variable with no ICU-pipeline counterpart, and it
  # is what lets the model represent escalation of care.
  careunit:
    enabled: true
    category: care_setting
    exclude_units: ["UNKNOWN", "Discharge Lounge"]

  # ICU-derived concepts, applied only to the ICU segments of admissions
  # that have them. Included because ICU physiology is real signal, not
  # noise; disable to obtain a strictly ward-comparable cohort.
  icu_concepts:
    enabled: true
    tables:
      vitalsign:
        category: vitals
        join: stay_id
        timestamp_col: charttime
        value_cols: [heart_rate, sbp, dbp, mbp, resp_rate, temperature, spo2]
      gcs:
        category: assessment
        join: stay_id
        timestamp_col: charttime
        value_cols: [gcs, gcs_motor, gcs_verbal, gcs_eyes]
      urine_output:
        category: output
        join: stay_id
        timestamp_col: charttime
        value_cols: [urineoutput]
      sofa:
        category: score
        join: stay_id
        timestamp_col: endtime
        value_cols: [sofa_24hours, respiration, coagulation, liver,
                     cardiovascular, cns, renal]

# ── Actions (interventions) ─────────────────────────────────────────────
actions:

  # Medication orders, admission-wide.
  #
  # Emitted as POINT events at starttime, not expanded across [start, stop).
  # The ICU pipeline reaches the same place by a different route: it extracts
  # prescriptions as continuous and then collapses the fan-out in
  # helpers/action_filter.py, "a 5-day Aspirin order is expanded into 120
  # hourly rows ... we emit it at the earliest step_idx only". Expanding here
  # only to collapse later would mean writing ~100M rows to discard them, and
  # it makes the action channel describe standing state rather than decisions.
  prescriptions:
    enabled: true
    category: medication_order
    is_continuous: false
    timestamp_col: starttime
    end_col: stoptime
    # Carriers, diluents, flushes and placeholder rows: high volume, no
    # clinical decision. Same set the ICU pipeline drops, expressed as LIKE
    # patterns so it also catches the strength-suffixed variants.
    exclude_drug_patterns:
      - "Vial"
      - "Bag"
      - "SW"
      - "Solution"
      - "Sterile Water"
      - "Syringe%"
      - "Iso-Osmotic%"
      - "%Flush%"
      - "D5W"
      - "NS"
      - "1/2 NS"
    max_active_per_bin: 10

  # Actual administrations. Point events, and the closest hospital-scope
  # analogue of the ICU pipeline's inputevents.
  emar:
    enabled: true
    category: medication_admin
    is_continuous: false
    timestamp_col: charttime
    # Keep only events that mean a drug reached the patient.
    keep_event_txt: ["Administered", "Started", "Restarted",
                     "Administered in Other Location", "Delayed Administered"]
    exclude_medication_patterns:
      - "%Flush%"
      - "Sterile Water"
      - "Vial"
      - "Bag"
      - "SW"
      - "D5W"
      - "NS"
    max_per_bin: 10

  # Coded procedures. chartdate is date-only, so these are pinned to noon
  # of the procedure day.
  procedures_icd:
    enabled: true
    category: procedure
    is_continuous: false
    pin_hour: 12

  # The mimic-code antibiotic concept is keyed on hadm_id (stay_id is NULL
  # outside the ICU), so unlike the rest of the derived tables it is already
  # admission-wide. Antibiotic exposure is a primary hospital intervention
  # and the anchor of any sepsis-adjacent downstream task, so it is worth
  # carrying separately from the generic prescriptions stream.
  antibiotic:
    enabled: true
    category: antibiotic
    is_continuous: true
    timestamp_col: starttime
    end_col: stoptime

  icu_concepts:
    enabled: true
    tables:
      ventilation:
        category: ventilation
        join: stay_id
        timestamp_col: starttime
        end_col: endtime
        is_continuous: true
        value_cols: [ventilation_status]
      vasoactive_agent:
        category: vasopressor
        join: stay_id
        timestamp_col: starttime
        end_col: endtime
        is_continuous: true
        value_cols: [norepinephrine, epinephrine, dopamine, dobutamine,
                     phenylephrine, vasopressin, milrinone]
      rrt:
        category: dialysis
        join: stay_id
        timestamp_col: charttime
        is_continuous: false
        value_cols: [dialysis_active, dialysis_type]

# ── Static (demographics) ───────────────────────────────────────────────
static:
  fields: [admission_age, gender, race, charlson_comorbidity_index,
           admission_type, admission_location, insurance]

# ── Per-bin label targets ───────────────────────────────────────────────
#
# The ICU pipeline probes 11 chartevents-derived targets (HR/MAP/SBP/RR and
# the SOFA sub-scores), which exist for only 19.4% of admissions here.
# These 16 are lab-driven, so they are populated across the whole cohort.
labels:
  targets:
    - {name: label_creatinine,      variable_name: creatinine,       source_table: chemistry,             agg: last}
    - {name: label_bun,             variable_name: bun,              source_table: chemistry,             agg: last}
    - {name: label_sodium,          variable_name: sodium,           source_table: chemistry,             agg: last}
    - {name: label_potassium,       variable_name: potassium,        source_table: chemistry,             agg: last}
    - {name: label_bicarbonate,     variable_name: bicarbonate,      source_table: chemistry,             agg: last}
    - {name: label_aniongap,        variable_name: aniongap,         source_table: chemistry,             agg: last}
    - {name: label_glucose,         variable_name: glucose,          source_table: chemistry,             agg: last}
    - {name: label_albumin,         variable_name: albumin,          source_table: chemistry,             agg: last}
    - {name: label_hemoglobin,      variable_name: hemoglobin,       source_table: complete_blood_count,  agg: last}
    - {name: label_hematocrit,      variable_name: hematocrit,       source_table: complete_blood_count,  agg: last}
    - {name: label_wbc,             variable_name: wbc,              source_table: complete_blood_count,  agg: last}
    - {name: label_platelet,        variable_name: platelet,         source_table: complete_blood_count,  agg: last}
    - {name: label_inr,             variable_name: inr,              source_table: coagulation,           agg: last}
    - {name: label_bilirubin_total, variable_name: bilirubin_total,  source_table: enzyme,                agg: last}
    - {name: label_lactate,         variable_name: lactate,          source_table: bg,                    agg: last}
    - {name: label_sbp,             variable_name: sbp,              source_table: omr,                   agg: last}
