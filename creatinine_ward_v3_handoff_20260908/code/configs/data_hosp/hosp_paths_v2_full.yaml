extends: hosp_paths.yaml

duckdb:
  threads: 16
  memory_limit: 64GB
  temp_directory: ${MEDIN_DATA_ROOT}/_duckdb_tmp

output:
  root: ${MEDIN_DATA_ROOT}
  cohort: ${MEDIN_DATA_ROOT}/cohort
  splits: ${MEDIN_DATA_ROOT}/splits
  observations: ${MEDIN_DATA_ROOT}/observations
  actions: ${MEDIN_DATA_ROOT}/actions
  discretized: ${MEDIN_DATA_ROOT}/discretized
  trajectories: ${MEDIN_DATA_ROOT}/trajectories
  trajectories_episode: ${MEDIN_DATA_ROOT}/trajectories_episode
  trajectories_dense: ${MEDIN_DATA_ROOT}/trajectories_dense
  trajectories_gap: ${MEDIN_DATA_ROOT}/trajectories_gap

sharding:
  n_buckets: 64
