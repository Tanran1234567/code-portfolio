# B2: full v0.3 curriculum with the absolute-time condition removed.
model:
  base_model: ${QWEN_PATH}
  checkpoint_dir: ${MEDIN_OUTPUT}/encoder_sft_v2_unified/final
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  torch_dtype: bfloat16
predictor:
  state_dim: 4096
  action_dim: 4096
  static_dim: 4096
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  ffn_dim: 4096
  max_timesteps: 72
  ffn_dropout: 0.15
  attn_dropout: 0.1
  prediction_mode: absolute
  use_continuous_time: false
  absolute_time_additive: false
  checkpoint: null
data:
  train_dir: ${MEDIN_DATA_ROOT}/trajectories_dense
  val_dir: ${MEDIN_DATA_ROOT}/trajectories_dense
  gap_train_dir: ${MEDIN_DATA_ROOT}/trajectories_gap
  max_seq_len: 4096
  min_length: 3
training:
  lr_encoder: 5.0e-5
  lr_predictor: 5.0e-4
  weight_decay: 0.04
  per_gpu_batch_size: 2
  grad_accum: 8
  warmup_ratio: 0.02
  seed: 42
  gradient_clip_encoder: 0.5
  gradient_clip_predictor: 1.0
  icu_frac: 0.5
  lambda_mask: 1.0
  min_context: 2
  mask_rates: {phase_2: 0.15, phase_3: 0.10, phase_5a: 0.20}
  phases:
    phase_1_steps: 4000
    phase_2_steps: 7000
    phase_3_steps: 2000
    phase_5a_steps: 4000
    phase_5b_steps: 7000
  ema: {tau_phase_2a: 0.996, tau_phase_2b: 0.996, target_precision: float32}
logging: {log_every: 10, eval_every: 200, eval_max_windows: 200, val_windows: 500}
save:
  dir: ${MEDIN_OUTPUT}/ablation_no_time_v2
  save_best: true
  save_final: true
hf:
  cache_dir: ${HF_HOME}
  offline: true
