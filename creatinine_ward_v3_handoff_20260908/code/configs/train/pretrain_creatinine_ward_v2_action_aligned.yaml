# Ward v2 predictor retraining. Reuses v1 SFT-best; no data/SFT rerun.
# Transition semantics: (state_t, recorded action_{t+1}) -> state_{t+1}.
model:
  base_model: ${QWEN_PATH}
  checkpoint_dir: ${CREATININE_WARD_OUTPUT}/encoder_sft/best
  attn_implementation: flash_attention_2
  gradient_checkpointing: true
  torch_dtype: bfloat16

predictor:
  state_dim: 4096
  action_dim: 4096
  static_dim: 4096
  hidden_dim: 1024
  num_layers: 6
  num_heads: 8
  ffn_dim: 4096
  max_timesteps: 30
  ffn_dropout: 0.15
  attn_dropout: 0.10
  prediction_mode: residual
  action_alignment: target_interval
  use_continuous_time: false
  absolute_time_additive: true

data:
  train_dir: ${CREATININE_WARD_DATA_ROOT}/trajectories
  val_dir: ${CREATININE_WARD_DATA_ROOT}/trajectories
  index_dir: ${CREATININE_WARD_V2_OUTPUT}/clin_jepa/trajectory_indices
  max_seq_len: 4096
  min_length: 4

training:
  # Preserve the SFT encoder geometry while still permitting the central
  # co-training phase to add weak dynamics grounding.
  lr_encoder: 1.0e-5
  lr_predictor: 3.0e-4
  weight_decay: 0.04
  # This layout already passed the v1 4-GPU memory run. Make it explicit so
  # the saved config, logs, and effective batch agree.
  per_gpu_batch_size: 11
  grad_accum: 2
  warmup_ratio: 0.02
  seed: 42
  gradient_clip_encoder: 0.5
  gradient_clip_predictor: 1.0
  rollout_horizon: 2
  # Original phase ratio is 6:6:2:9. 1600 steps is a deliberate middle
  # ground: 4x the failed v1 update budget, not a 493-exposure 11776-step run.
  phases:
    phase_1_steps: 417
    phase_2a_steps: 417
    phase_2b_steps: 139
    phase_4_steps: 627
  ema:
    # 0.971^139 ~= 0.0167, matching the residual target lag of
    # 0.996^1024 in the paper's alignment phase.
    tau_phase_2a: 0.971
    tau_phase_2b: 0.971
    target_precision: float32

logging:
  log_every: 20
  eval_every: 100
  eval_max_windows: 200
  val_windows: 450
  resume_every: 50

save:
  dir: ${CREATININE_WARD_V2_OUTPUT}/clin_jepa
  save_best: true
  save_final: true

hf:
  cache_dir: ${HF_HOME}
  offline: true
